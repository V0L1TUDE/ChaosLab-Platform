# Example app for ChaosLab's sandbox: upload this file, click "Deploy to sandbox", then run experiments.
# Only Deployment / Service (ClusterIP) / ConfigMap are accepted; images must pin a tag from an allowed registry.
# Containers always run as non-root (runAsNonRoot is enforced), so use images that do not need root.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  GREETING: "hello from the api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine   # listens on 8080 as uid 101
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=hello from the api"]
          securityContext:
            runAsUser: 65534                                  # nobody
          ports:
            - containerPort: 5678
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 5678
      targetPort: 5678
