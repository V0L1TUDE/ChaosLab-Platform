apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaoslab-tenant-workloads
  annotations:
    chaoslab.io/policy-version: 2026-11-19.1
    chaoslab.io/policy-digest: c4348cf6d47dd89f
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      resources:
      - pods
      operations:
      - CREATE
      - UPDATE
    - apiGroups:
      - apps
      apiVersions:
      - v1
      resources:
      - deployments
      - replicasets
      operations:
      - CREATE
      - UPDATE
  variables:
  - name: spec
    expression: 'object.kind == ''Pod'' ? object.spec : object.spec.template.spec'
  validations:
  - expression: has(variables.spec.runtimeClassName) && variables.spec.runtimeClassName
      == 'gvisor'
    message: 'ChaosLab tenant policy: pods must use the sandboxed RuntimeClass ''gvisor''.'
  - expression: has(variables.spec.nodeSelector) && 'chaoslab.io/tenant-pool' in variables.spec.nodeSelector
      && variables.spec.nodeSelector['chaoslab.io/tenant-pool'] == 'true'
    message: 'ChaosLab tenant policy: pods must be pinned to the tenant node pool
      (chaoslab.io/tenant-pool=true).'
  - expression: '!has(variables.spec.nodeName)'
    message: 'ChaosLab tenant policy: pods may not choose a node directly.'
  - expression: '!(has(variables.spec.hostNetwork) && variables.spec.hostNetwork)
      && !(has(variables.spec.hostPID) && variables.spec.hostPID) && !(has(variables.spec.hostIPC)
      && variables.spec.hostIPC)'
    message: 'ChaosLab tenant policy: host namespaces (network, PID, IPC) are not
      allowed.'
  - expression: '!has(variables.spec.volumes) || variables.spec.volumes.all(vol, has(vol.emptyDir)
      || has(vol.configMap))'
    message: 'ChaosLab tenant policy: only emptyDir and configMap volumes are allowed
      (no hostPath, secrets, PVCs or projected tokens).'
  - expression: has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken
      == false
    message: 'ChaosLab tenant policy: service-account tokens must not be mounted.'
  - expression: (!has(variables.spec.initContainers) || size(variables.spec.initContainers)
      == 0) && (!has(variables.spec.ephemeralContainers) || size(variables.spec.ephemeralContainers)
      == 0)
    message: 'ChaosLab tenant policy: init and ephemeral containers are not allowed.'
  - expression: has(variables.spec.securityContext) && has(variables.spec.securityContext.seccompProfile)
      && variables.spec.securityContext.seccompProfile.type == 'RuntimeDefault'
    message: 'ChaosLab tenant policy: the pod seccomp profile must be RuntimeDefault.'
  - expression: '!has(variables.spec.securityContext) || !has(variables.spec.securityContext.runAsUser)
      || variables.spec.securityContext.runAsUser != 0'
    message: 'ChaosLab tenant policy: pods must not run as root (runAsUser 0).'
  - expression: '!has(variables.spec.securityContext) || !has(variables.spec.securityContext.sysctls)
      || size(variables.spec.securityContext.sysctls) == 0'
    message: 'ChaosLab tenant policy: sysctls are not allowed.'
  - expression: variables.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot)
      && c.securityContext.runAsNonRoot == true && (!has(c.securityContext.runAsUser)
      || c.securityContext.runAsUser != 0))
    message: 'ChaosLab tenant policy: every container must set runAsNonRoot: true
      and must not run as user 0.'
  - expression: variables.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
      && c.securityContext.allowPrivilegeEscalation == false && (!has(c.securityContext.privileged)
      || c.securityContext.privileged == false))
    message: 'ChaosLab tenant policy: containers must not be privileged and must set
      allowPrivilegeEscalation: false.'
  - expression: variables.spec.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
      && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop
      && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add)
      == 0))
    message: 'ChaosLab tenant policy: containers must drop ALL capabilities and add
      none.'
  - expression: variables.spec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.seccompProfile)
      || c.securityContext.seccompProfile.type == 'RuntimeDefault')
    message: 'ChaosLab tenant policy: container seccomp profiles must be RuntimeDefault.'
  - expression: variables.spec.containers.all(c, has(c.resources) && has(c.resources.limits)
      && 'cpu' in c.resources.limits && 'memory' in c.resources.limits)
    message: 'ChaosLab tenant policy: every container must set CPU and memory limits.'
  - expression: variables.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort)
      || p.hostPort == 0))
    message: 'ChaosLab tenant policy: hostPort is not allowed.'
  - expression: variables.spec.containers.all(c, ['docker.io/', 'ghcr.io/', 'gcr.io/',
      'quay.io/', 'registry.k8s.io/', 'public.ecr.aws/', 'mcr.microsoft.com/'].exists(r,
      c.image.startsWith(r)))
    message: 'ChaosLab tenant policy: images must come from an approved registry (fully
      qualified, e.g. docker.io/library/nginx:1.27).'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chaoslab-deployer-scope
  annotations:
    chaoslab.io/policy-version: 2026-11-19.1
    chaoslab.io/policy-digest: c4348cf6d47dd89f
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - '*'
      apiVersions:
      - '*'
      resources:
      - '*'
      operations:
      - CREATE
      - UPDATE
      - DELETE
  matchConditions:
  - name: only-the-chaoslab-deployer
    expression: request.userInfo.username == 'system:serviceaccount:chaoslab-system:chaoslab-deployer'
  - name: not-access-reviews
    expression: '!(request.resource.group in [''authorization.k8s.io'', ''authentication.k8s.io''])'
  validations:
  - expression: request.kind.kind == 'Namespace' || (request.namespace != '' && namespaceObject
      != null && has(namespaceObject.metadata.labels) && 'chaoslab.io/managed-by'
      in namespaceObject.metadata.labels && namespaceObject.metadata.labels['chaoslab.io/managed-by']
      == 'chaoslab-online')
    message: 'ChaosLab tenant policy: the ChaosLab deployer may only change objects
      inside namespaces that ChaosLab manages.'
  - expression: request.kind.kind != 'Namespace' || request.name.startsWith('cl-app-')
    message: 'ChaosLab tenant policy: the ChaosLab deployer may only manage namespaces
      named cl-app-<id>.'
  - expression: request.kind.kind != 'Namespace' || request.operation == 'DELETE'
      || (has(object.metadata.labels) && 'chaoslab.io/managed-by' in object.metadata.labels
      && object.metadata.labels['chaoslab.io/managed-by'] == 'chaoslab-online' &&
      'pod-security.kubernetes.io/enforce' in object.metadata.labels && object.metadata.labels['pod-security.kubernetes.io/enforce']
      == 'restricted')
    message: 'ChaosLab tenant policy: ChaosLab namespaces must keep the managed-by
      label and Pod Security ''restricted''.'
  - expression: request.kind.kind != 'Namespace' || request.operation != 'DELETE'
      || (has(oldObject.metadata.labels) && 'chaoslab.io/managed-by' in oldObject.metadata.labels
      && oldObject.metadata.labels['chaoslab.io/managed-by'] == 'chaoslab-online')
    message: 'ChaosLab tenant policy: the ChaosLab deployer may only delete namespaces
      that ChaosLab manages.'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaoslab-tenant-workloads
  annotations:
    chaoslab.io/policy-version: 2026-11-19.1
    chaoslab.io/policy-digest: c4348cf6d47dd89f
spec:
  policyName: chaoslab-tenant-workloads
  validationActions:
  - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        chaoslab.io/managed-by: chaoslab-online
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chaoslab-deployer-scope
  annotations:
    chaoslab.io/policy-version: 2026-11-19.1
    chaoslab.io/policy-digest: c4348cf6d47dd89f
spec:
  policyName: chaoslab-deployer-scope
  validationActions:
  - Deny
