name: payment-service-pod-kill

target:
  namespace: default
  label:
    app: paymentservice

fault:
  type: pod-kill
  mode: one

recovery:
  timeout_seconds: 60

verification:
  expected_ready_replicas: 1
  application:
    enabled: true
    grpc_health_check: true
    expected_health_status: "SERVING"
    functional_test: true
    verify_logs: true
    expected_log_pattern: "PaymentService gRPC server started"
  telemetry:
    enabled: true
    service_name: "paymentservice"
    max_allowed_p95_ms: 1000
