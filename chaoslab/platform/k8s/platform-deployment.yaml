apiVersion: v1
kind: Namespace
metadata:
  name: chaoslab-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chaoslab-db-pvc
  namespace: chaoslab-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaoslab-platform
  namespace: chaoslab-platform
  labels:
    app.kubernetes.io/name: chaoslab-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chaoslab-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chaoslab-platform
    spec:
      containers:
        - name: platform
          image: chaoslab/platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CHAOSLAB_PORT
              value: "8000"
            - name: CHAOSLAB_DB_PATH
              value: "/app/data/chaoslab_platform.db"
            - name: CHAOSLAB_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chaoslab-platform-secrets
                  key: jwt-secret
                  optional: true
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: chaoslab-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: chaoslab-platform
  namespace: chaoslab-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chaoslab-platform
  ports:
    - port: 8000
      targetPort: 8000
      name: http
