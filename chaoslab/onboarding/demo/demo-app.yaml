# Disposable sample workload for an isolated local Kubernetes cluster only.
# Applying this file explicitly creates a namespace and small web workload.
apiVersion: v1
kind: Namespace
metadata:
  name: chaoslab-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaoslab-sample
  namespace: chaoslab-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chaoslab-sample
  template:
    metadata:
      labels:
        app: chaoslab-sample
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaoslab-sample
  namespace: chaoslab-demo
spec:
  selector:
    app: chaoslab-sample
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
