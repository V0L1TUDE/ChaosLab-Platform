apiVersion: v1
kind: Namespace
metadata:
  name: chaoslab-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaoslab-jaeger
  namespace: chaoslab-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaoslab-jaeger
  template:
    metadata:
      labels:
        app: chaoslab-jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          ports:
            - containerPort: 16686
            - containerPort: 4317
          readinessProbe:
            httpGet:
              path: /api/v3/services
              port: 16686
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chaoslab-jaeger
  namespace: chaoslab-observability
spec:
  type: ClusterIP
  selector:
    app: chaoslab-jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
