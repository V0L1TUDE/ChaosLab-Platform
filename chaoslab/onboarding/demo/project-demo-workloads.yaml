# Disposable local project/user services. Source ConfigMaps are generated by prepare_project_demo.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaoslab-user
  namespace: chaoslab-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaoslab-user
  template:
    metadata:
      labels:
        app: chaoslab-user
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
      - name: dependencies
        image: python:3.11-slim
        command:
        - python
        - -m
        - pip
        - install
        - --no-cache-dir
        - --disable-pip-version-check
        - --target=/deps
        - -r
        - /source/requirements.txt
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: dependencies
          mountPath: /deps
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      containers:
      - name: chaoslab-user
        image: python:3.11-slim
        workingDir: /source
        command:
        - python
        - -m
        - uvicorn
        - main:app
        - --host
        - 0.0.0.0
        - --port
        - '8001'
        env:
        - name: PYTHONPATH
          value: /deps
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: USER_SERVICE_URL
          value: http://chaoslab-user:8001
        ports:
        - containerPort: 8001
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: dependencies
          mountPath: /deps
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
      volumes:
      - name: source
        configMap:
          name: chaoslab-user-source
      - name: dependencies
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chaoslab-user
  namespace: chaoslab-demo
spec:
  selector:
    app: chaoslab-user
  ports:
  - port: 8001
    targetPort: 8001
---
