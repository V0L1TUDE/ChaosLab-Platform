apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service
  namespace: learning-platform
  labels:
    app: student-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-service
  template:
    metadata:
      labels:
        app: student-service
    spec:
      containers:
      - name: student-service
        image: lms-student-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8011
        env:
        - name: COLLECTOR_ADDR
          value: "opentelemetrycollector.default.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "student-service"
        readinessProbe:
          httpGet:
            path: /health
            port: 8011
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8011
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 300m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: student-service
  namespace: learning-platform
  labels:
    app: student-service
spec:
  type: ClusterIP
  selector:
    app: student-service
  ports:
  - port: 8011
    targetPort: 8011
---
