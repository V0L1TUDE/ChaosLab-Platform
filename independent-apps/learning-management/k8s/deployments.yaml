apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend
  namespace: learning-platform
  labels:
    app: lms-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lms-frontend
  template:
    metadata:
      labels:
        app: lms-frontend
    spec:
      containers:
      - name: lms-frontend
        image: lms-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lms-frontend
  namespace: learning-platform
  labels:
    app: lms-frontend
spec:
  type: NodePort
  selector:
    app: lms-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
