<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream &bull; Modern Microservices Learning Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        code, .font-mono { font-family: 'JetBrains Mono', monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [view, setView] = useState("dashboard"); // dashboard, courses, course-details, enrollments, progress
            const [courses, setCourses] = useState([]);
            const [students, setStudents] = useState([]);
            const [enrollments, setEnrollments] = useState([]);
            const [selectedCourse, setSelectedCourse] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showEnrollModal, setShowEnrollModal] = useState(false);
            const [enrollForm, setEnrollForm] = useState({ student_id: "", course_id: "" });
            const [statusMsg, setStatusMsg] = useState(null);

            // Fetch live microservices data
            const fetchData = async () => {
                setLoading(true);
                try {
                    const [resS, resC, resE] = await Promise.all([
                        fetch("/api/students").then(r => r.ok ? r.json() : []),
                        fetch("/api/courses").then(r => r.ok ? r.json() : []),
                        fetch("/api/enrollments").then(r => r.ok ? r.json() : [])
                    ]);
                    if (resS.length) setStudents(resS);
                    if (resC.length) setCourses(resC);
                    if (resE.length) setEnrollments(resE);
                } catch (e) {
                    console.warn("Backend services starting up or under chaos test:", e);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(fetchData, 8000);
                return () => clearInterval(interval);
            }, []);

            // Fallback mock data if services are starting
            const displayCourses = courses.length ? courses : [
                { id: "crs-101", title: "Production Kubernetes & Chaos Engineering", instructor: "Dr. Alex Thorne", category: "Cloud & Reliability", level: "Advanced", duration_hours: 24, total_lessons: 12, rating: 4.9, enrolled_count: 142 },
                { id: "crs-102", title: "Distributed Systems Observability with OpenTelemetry", instructor: "Maya Lin", category: "Observability", level: "Intermediate", duration_hours: 16, total_lessons: 8, rating: 4.8, enrolled_count: 98 },
                { id: "crs-103", title: "Modern Microservice Architectures with FastAPI", instructor: "David Vance", category: "Backend Engineering", level: "Beginner", duration_hours: 20, total_lessons: 10, rating: 4.7, enrolled_count: 215 }
            ];

            const displayStudents = students.length ? students : [
                { id: "stu-01", name: "Sarah Jenkins", email: "sarah.j@techcorp.io", major: "Site Reliability", enrolled_date: "2026-01-15", active: true },
                { id: "stu-02", name: "Liam Patel", email: "liam.p@devops.net", major: "Cloud Architecture", enrolled_date: "2026-01-20", active: true },
                { id: "stu-03", name: "Elena Rostova", email: "elena.r@quantum.org", major: "Distributed Computing", enrolled_date: "2026-02-01", active: true }
            ];

            const displayEnrollments = enrollments.length ? enrollments : [
                { id: "enr-701", student_id: "stu-01", student_name: "Sarah Jenkins", course_id: "crs-101", course_title: "Production Kubernetes & Chaos Engineering", completed_lessons: 10, total_lessons: 12, progress_pct: 83, status: "IN_PROGRESS" },
                { id: "enr-702", student_id: "stu-02", student_name: "Liam Patel", course_id: "crs-102", course_title: "Distributed Systems Observability with OpenTelemetry", completed_lessons: 8, total_lessons: 8, progress_pct: 100, status: "COMPLETED" },
                { id: "enr-703", student_id: "stu-03", student_name: "Elena Rostova", course_id: "crs-101", course_title: "Production Kubernetes & Chaos Engineering", completed_lessons: 4, total_lessons: 12, progress_pct: 33, status: "IN_PROGRESS" }
            ];

            const handleEnroll = async (e) => {
                e.preventDefault();
                try {
                    const res = await fetch("/api/enrollments", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(enrollForm)
                    });
                    if (res.ok) {
                        const newEnr = await res.json();
                        setEnrollments(prev => [...prev, newEnr]);
                        setShowEnrollModal(false);
                        setStatusMsg({ type: "success", text: "Student enrolled successfully!" });
                    } else {
                        throw new Error("Enrollment service response code: " + res.status);
                    }
                } catch (err) {
                    // Optimistic update for UI demo
                    const newId = `enr-${Date.now().toString().slice(-3)}`;
                    const stu = displayStudents.find(s => s.id === enrollForm.student_id);
                    const crs = displayCourses.find(c => c.id === enrollForm.course_id);
                    const optEnr = {
                        id: newId,
                        student_id: enrollForm.student_id,
                        student_name: stu ? stu.name : enrollForm.student_id,
                        course_id: enrollForm.course_id,
                        course_title: crs ? crs.title : enrollForm.course_id,
                        completed_lessons: 0,
                        total_lessons: crs ? crs.total_lessons : 10,
                        progress_pct: 0,
                        status: "ENROLLED"
                    };
                    setEnrollments(prev => [...prev, optEnr]);
                    setShowEnrollModal(false);
                    setStatusMsg({ type: "success", text: "Enrollment recorded (local resilient state)." });
                }
                setTimeout(() => setStatusMsg(null), 4000);
            };

            const handleUpdateProgress = async (enrollmentId, delta) => {
                const enr = displayEnrollments.find(e => e.id === enrollmentId);
                if (!enr) return;
                const newCompleted = Math.max(0, Math.min(enr.total_lessons, enr.completed_lessons + delta));
                const newPct = Math.round((newCompleted / enr.total_lessons) * 100);

                try {
                    await fetch(`/api/enrollments/${enrollmentId}/progress`, {
                        method: "PATCH",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ completed_lessons: newCompleted, progress_pct: newPct })
                    });
                } catch (err) {
                    console.warn("Patch failed, applying locally:", err);
                }

                setEnrollments(prev => prev.map(item => {
                    if (item.id === enrollmentId) {
                        return {
                            ...item,
                            completed_lessons: newCompleted,
                            progress_pct: newPct,
                            status: newPct >= 100 ? "COMPLETED" : "IN_PROGRESS"
                        };
                    }
                    return item;
                }));
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Top Navbar */}
                    <header className="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="h-9 w-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-white font-extrabold text-lg">
                                    E
                                </div>
                                <div>
                                    <span className="text-xl font-bold tracking-tight text-white">EduStream</span>
                                    <span className="ml-2 text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">LMS Platform</span>
                                </div>
                            </div>

                            {/* Navigation Tabs */}
                            <nav className="flex space-x-1 sm:space-x-2">
                                {[
                                    { id: "dashboard", label: "Dashboard", icon: "📊" },
                                    { id: "courses", label: "Courses", icon: "📚" },
                                    { id: "enrollments", label: "My Enrollments", icon: "🎓" },
                                    { id: "progress", label: "Learning Progress", icon: "📈" }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => { setView(tab.id); setSelectedCourse(null); }}
                                        className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-150 flex items-center space-x-1.5 ${
                                            view === tab.id
                                                ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 shadow-sm"
                                                : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/60"
                                        }`}
                                    >
                                        <span>{tab.icon}</span>
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </nav>

                            <div className="flex items-center space-x-3">
                                <div className="flex items-center space-x-2 text-xs font-mono bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/60">
                                    <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                    <span className="text-slate-300">k8s: learning-platform</span>
                                </div>
                                <button
                                    onClick={() => setShowEnrollModal(true)}
                                    className="px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/30 transition-all flex items-center space-x-1.5"
                                >
                                    <span>+</span>
                                    <span>Enroll Student</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Status Alert */}
                    {statusMsg && (
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
                            <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 px-4 py-2 rounded-lg text-sm flex items-center justify-between">
                                <span>{statusMsg.text}</span>
                                <button onClick={() => setStatusMsg(null)} className="text-emerald-400 hover:text-white">&times;</button>
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {view === "dashboard" && (
                            <DashboardView
                                courses={displayCourses}
                                students={displayStudents}
                                enrollments={displayEnrollments}
                                onSelectCourse={(c) => { setSelectedCourse(c); setView("course-details"); }}
                                onGoToEnrollments={() => setView("enrollments")}
                            />
                        )}

                        {view === "courses" && (
                            <CoursesView
                                courses={displayCourses}
                                onSelectCourse={(c) => { setSelectedCourse(c); setView("course-details"); }}
                                onEnrollCourse={(c) => {
                                    setEnrollForm(prev => ({ ...prev, course_id: c.id, student_id: displayStudents[0]?.id || "" }));
                                    setShowEnrollModal(true);
                                }}
                            />
                        )}

                        {view === "course-details" && selectedCourse && (
                            <CourseDetailView
                                course={selectedCourse}
                                onBack={() => setView("courses")}
                                onEnroll={() => {
                                    setEnrollForm(prev => ({ ...prev, course_id: selectedCourse.id, student_id: displayStudents[0]?.id || "" }));
                                    setShowEnrollModal(true);
                                }}
                            />
                        )}

                        {view === "enrollments" && (
                            <EnrollmentsView
                                enrollments={displayEnrollments}
                                onUpdateProgress={handleUpdateProgress}
                            />
                        )}

                        {view === "progress" && (
                            <ProgressAnalyticsView
                                enrollments={displayEnrollments}
                                courses={displayCourses}
                                students={displayStudents}
                            />
                        )}
                    </main>

                    {/* Enroll Modal */}
                    {showEnrollModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
                                <h3 className="text-lg font-bold text-white mb-1">New Course Enrollment</h3>
                                <p className="text-xs text-slate-400 mb-4">Coordinates across Enrollment &bull; Course &bull; Student microservices.</p>

                                <form onSubmit={handleEnroll} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Select Student</label>
                                        <select
                                            className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                                            value={enrollForm.student_id}
                                            onChange={e => setEnrollForm({ ...enrollForm, student_id: e.target.value })}
                                            required
                                        >
                                            <option value="">-- Choose Student --</option>
                                            {displayStudents.map(s => (
                                                <option key={s.id} value={s.id}>{s.name} ({s.email})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Select Course</label>
                                        <select
                                            className="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                                            value={enrollForm.course_id}
                                            onChange={e => setEnrollForm({ ...enrollForm, course_id: e.target.value })}
                                            required
                                        >
                                            <option value="">-- Choose Course --</option>
                                            {displayCourses.map(c => (
                                                <option key={c.id} value={c.id}>{c.title} ({c.level})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex justify-end space-x-3 pt-3 border-t border-slate-800">
                                        <button
                                            type="button"
                                            onClick={() => setShowEnrollModal(false)}
                                            className="px-4 py-2 text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 text-sm font-semibold bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg shadow-md transition"
                                        >
                                            Confirm Enrollment
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="border-t border-slate-800/80 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                            <div className="flex items-center space-x-2">
                                <span className="font-semibold text-slate-400">EduStream Platform</span>
                                <span>&bull;</span>
                                <span>FastAPI &bull; React &bull; OpenTelemetry</span>
                            </div>
                            <div className="font-mono text-slate-500">
                                Tested autonomously by ChaosLab Universal Engine
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        /* ---------------- VIEW 1: DASHBOARD ---------------- */
        function DashboardView({ courses, students, enrollments, onSelectCourse, onGoToEnrollments }) {
            const completedCount = enrollments.filter(e => e.status === "COMPLETED").length;
            const inProgressCount = enrollments.filter(e => e.status === "IN_PROGRESS" || e.status === "ENROLLED").length;
            const avgProgress = enrollments.length ? Math.round(enrollments.reduce((acc, cur) => acc + cur.progress_pct, 0) / enrollments.length) : 0;

            return (
                <div className="space-y-8">
                    {/* Top Stats Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                            <div className="absolute top-0 right-0 h-16 w-16 bg-emerald-500/10 rounded-bl-3xl"></div>
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Courses</div>
                            <div className="text-3xl font-extrabold text-white mt-2">{courses.length}</div>
                            <div className="text-xs text-emerald-400 mt-2 flex items-center">
                                <span>Full catalog available</span>
                            </div>
                        </div>

                        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                            <div className="absolute top-0 right-0 h-16 w-16 bg-blue-500/10 rounded-bl-3xl"></div>
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Enrolled Students</div>
                            <div className="text-3xl font-extrabold text-white mt-2">{students.length}</div>
                            <div className="text-xs text-blue-400 mt-2 flex items-center">
                                <span>Active learners</span>
                            </div>
                        </div>

                        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                            <div className="absolute top-0 right-0 h-16 w-16 bg-teal-500/10 rounded-bl-3xl"></div>
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Enrollments</div>
                            <div className="text-3xl font-extrabold text-white mt-2">{enrollments.length}</div>
                            <div className="text-xs text-teal-400 mt-2 flex items-center">
                                <span>{completedCount} completed ({Math.round((completedCount / (enrollments.length || 1)) * 100)}%)</span>
                            </div>
                        </div>

                        <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-5 shadow-lg relative overflow-hidden">
                            <div className="absolute top-0 right-0 h-16 w-16 bg-amber-500/10 rounded-bl-3xl"></div>
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Average Progress</div>
                            <div className="text-3xl font-extrabold text-white mt-2">{avgProgress}%</div>
                            <div className="w-full bg-slate-800 rounded-full h-1.5 mt-3 overflow-hidden">
                                <div className="bg-amber-400 h-1.5 rounded-full" style={{ width: `${avgProgress}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* Featured Courses Section */}
                    <div>
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                                <span>📚</span>
                                <span>Curated Engineering Tracks</span>
                            </h2>
                            <span className="text-xs text-slate-400">Microservice-driven courses</span>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                            {courses.map(course => (
                                <div
                                    key={course.id}
                                    onClick={() => onSelectCourse(course)}
                                    className="bg-slate-900/80 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-5 shadow-md cursor-pointer transition-all hover:scale-[1.01] flex flex-col justify-between"
                                >
                                    <div>
                                        <div className="flex items-center justify-between text-xs mb-3">
                                            <span className="px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">{course.category}</span>
                                            <span className="text-slate-400 font-mono">{course.level}</span>
                                        </div>
                                        <h3 className="text-base font-bold text-white mb-2 leading-snug">{course.title}</h3>
                                        <p className="text-xs text-slate-400 mb-4">Instructor: <span className="text-slate-300 font-medium">{course.instructor}</span></p>
                                    </div>
                                    <div className="pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400 font-mono">
                                        <span>⏱️ {course.duration_hours}h</span>
                                        <span>📖 {course.total_lessons} lessons</span>
                                        <span>⭐ {course.rating}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Active Learning Progress Table */}
                    <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 shadow-md">
                        <div className="flex items-center justify-between mb-4">
                            <h2 className="text-lg font-bold text-white flex items-center space-x-2">
                                <span>🎓</span>
                                <span>Active Student Progress</span>
                            </h2>
                            <button
                                onClick={onGoToEnrollments}
                                className="text-xs font-semibold text-emerald-400 hover:text-emerald-300"
                            >
                                Manage All &rarr;
                            </button>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead>
                                    <tr className="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                        <th className="pb-3">Enrollment</th>
                                        <th className="pb-3">Student</th>
                                        <th className="pb-3">Course</th>
                                        <th className="pb-3">Lessons</th>
                                        <th className="pb-3">Progress</th>
                                        <th className="pb-3">Status</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60 font-sans">
                                    {enrollments.slice(0, 5).map(e => (
                                        <tr key={e.id} className="hover:bg-slate-800/30">
                                            <td className="py-3 font-mono text-xs text-slate-400">{e.id}</td>
                                            <td className="py-3 font-medium text-slate-200">{e.student_name || e.student_id}</td>
                                            <td className="py-3 text-slate-300 max-w-xs truncate">{e.course_title || e.course_id}</td>
                                            <td className="py-3 font-mono text-xs text-slate-400">{e.completed_lessons} / {e.total_lessons}</td>
                                            <td className="py-3 w-40">
                                                <div className="flex items-center space-x-2">
                                                    <div className="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
                                                        <div
                                                            className={`h-1.5 rounded-full ${e.progress_pct === 100 ? 'bg-emerald-400' : 'bg-teal-400'}`}
                                                            style={{ width: `${e.progress_pct}%` }}
                                                        ></div>
                                                    </div>
                                                    <span className="font-mono text-xs text-slate-300 w-8">{e.progress_pct}%</span>
                                                </div>
                                            </td>
                                            <td className="py-3">
                                                <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${
                                                    e.status === "COMPLETED"
                                                        ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
                                                        : "bg-blue-500/20 text-blue-300 border border-blue-500/30"
                                                }`}>
                                                    {e.status}
                                                </span>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>

                                </div>
                                <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                    <div className="text-slate-400">Telemetry Engine</div>
                                    <div className="text-teal-400 font-bold mt-1">OpenTelemetry OTLP</div>
                                </div>
                                <div className="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                    <div className="text-slate-400">Collector Endpoint</div>

        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
