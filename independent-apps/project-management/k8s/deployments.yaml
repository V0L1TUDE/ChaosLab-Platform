apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-frontend
  namespace: project-platform
  labels:
    app: pm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pm-frontend
  template:
    metadata:
      labels:
        app: pm-frontend
    spec:
      containers:
      - name: pm-frontend
        image: pulse-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pm-frontend
  namespace: project-platform
  labels:
    app: pm-frontend
spec:
  type: NodePort
  selector:
    app: pm-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
